<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghwnsehd 블로그</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #4b5563;
            --border: #dfe7f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        .card {
            width: min(90vw, 720px);
            padding: 2rem 2.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>안녕하세요! 제 깃허브 페이지에 오신 것을 환영합니다.</h1>
        <p>개인 사이트 빌드 중입니다.</p>
    </main>
</body>
</html>
